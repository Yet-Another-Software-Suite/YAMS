name: Build Examples

on:
  push:
    branches: [ "master" ]
    paths:
      - "examples/**"
      - "yams/**"
  pull_request:
    paths:
      - "examples/**"
      - "yams/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  list-examples:
    name: List Examples With Tests
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - name: List java examples with unit tests
        id: list
        # The examples/commands2 and examples/commands3 projects with their own unit tests, as a JSON
        # array for the matrix.
        run: |
          set -o pipefail
          examples=$(make --no-print-directory list-tested | jq -R . | jq -cs .)
          echo "$examples"
          test "$examples" != "[]"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
        working-directory: examples

  build-example:
    name: Build ${{ matrix.example }}
    needs: list-examples
    runs-on: ubuntu-latest
    strategy:
      # Each example with unit tests runs them on its own runner, so one example's simulated devices
      # cannot run another's out, and one failing example does not cancel the rest.
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # No SystemCore toolchain: a Java example builds a jar and runs its tests on the desktop, so it
      # never cross compiles. Only the C++ example needs the toolchain.
      - name: Build ${{ matrix.example }}
        # Generates the example into examples/generated, then builds it.
        run: make build-one EXAMPLE=${{ matrix.example }}
        working-directory: examples

  build-untested-examples:
    name: Build Examples Without Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build java examples without unit tests
        # They simulate no devices, so one runner builds them all, one after another.
        run: make build-untested
        working-directory: examples

  build-cpp-example:
    name: Build C++ example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Toolchain
        working-directory: vendordep
        run: chmod a+x gradlew && ./gradlew installSystemCoreToolchain
      - name: Build C++ example
        run: ./gradlew build
        working-directory: examples/cpptest
        continue-on-error: true
