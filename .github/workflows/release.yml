name: Build and Release
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version number"
        type: string
        required: true
      publish:
        type: boolean
        description: "Publish to WPILib"
        default: false
      buildCpp:
        type: boolean
        description: "Build and release the C++ library (always on when Publish to WPILib is checked)"
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Publishing to WPILib always includes the C++ library, regardless of the buildCpp input.
  skipCpp: ${{ !(inputs.publish || inputs.buildCpp) }}

# Mirrors ci.yml's build jobs, but only runs `publish` (never `build` or `test`) so no unit tests
# are compiled or run during a release.
jobs:
  build-cross:
    name: Release - ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/systemcore-cross-debian:trixie
            artifact-name: SystemCore
            build-options: "-Ponlylinuxsystemcore"
          - container: wpilib/aarch64-cross-debian:trixie
            artifact-name: Arm64
            build-options: "-Ponlylinuxarm64"
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    env:
      releaseVersion: ${{ inputs.releaseVersion }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - name: Install toolchain
        run: ./gradlew installSystemCoreToolchain
        working-directory: vendordep
      - name: Publish
        run: ./gradlew publish ${{ matrix.build-options }} -PskipCpp=${{ env.skipCpp }}
        working-directory: vendordep
      - uses: actions/upload-artifact@v7
        with:
          name: maven-${{ matrix.artifact-name }}
          path: vendordep/build/maven/

  build-host:
    name: Release - ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact-name: windows
            gradlew: ./gradlew.bat
            architecture: x64
            build-options: "-Ponlywindows64"
          - os: macos-15
            artifact-name: macos
            gradlew: ./gradlew
            architecture: aarch64
            build-options: "-Ponlyosxuniversal"
    runs-on: ${{ matrix.os }}
    env:
      releaseVersion: ${{ inputs.releaseVersion }}
    defaults:
      run:
        working-directory: vendordep
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          architecture: ${{ matrix.architecture }}
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v6
      - name: Install toolchain
        run: ${{ matrix.gradlew }} installSystemCoreToolchain
      - name: Publish
        run: ${{ matrix.gradlew }} publish -PskipCpp=${{ env.skipCpp }} ${{ matrix.build-options }}
      - uses: actions/upload-artifact@v7
        with:
          name: maven-${{ matrix.artifact-name }}
          path: vendordep/build/maven/

  build-examples:
    name: Release - Examples
    needs: [build-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate Java examples
        run: mkdir -p generated && make
        working-directory: examples
      - name: Download YAMS vendordep JSONs
        uses: actions/download-artifact@v7
        with:
          name: maven-windows
          path: maven-windows/
      - name: Strip testing-only fixups from generated examples
        run: |
          for dir in examples/generated/*/; do
            name=$(basename "$dir")
            gradleFile="$dir/build.gradle"

            # Commands v3 examples are generated with a "commands3-" prefix; everything else is
            # a Commands v2 example.
            if [[ "$name" == commands3-* ]]; then
              yamsJson="yams_commands3.json"
            else
              yamsJson="yams_commands2.json"
            fi

            # The YAMS_TESTING fixup compiles against yams/java directly so example
            # builds don't depend on a published vendordep. Every real example should
            # instead consume the generated vendordep JSON like a real consumer would.
            sed -i '/\/\/ YAMS_TESTING/,/\/\/ END_YAMS_TESTING/d' "$gradleFile"
            mkdir -p "$dir/vendordeps"
            cp "${{ github.workspace }}/maven-windows/$yamsJson" "$dir/vendordeps/$yamsJson"
          done
      - name: Zip generated Java examples
        run: |
          mkdir -p ${{ github.workspace }}/example-artifacts
          cd examples/generated
          for dir in */; do
            name=$(basename "$dir")
            zip -r "${{ github.workspace }}/example-artifacts/example-${name}.zip" "$name"
          done
      - name: Zip C++ example
        run: |
          cd examples
          zip -r ${{ github.workspace }}/example-artifacts/example-cpptest.zip cpptest/ -x "cpptest/.gradle/*" -x "cpptest/build/*"
      - uses: actions/upload-artifact@v7
        with:
          name: release-examples
          path: example-artifacts/

  release:
    name: Release - Linux (publish)
    needs: [build-cross, build-host, build-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      deployments: read
      id-token: write
    env:
      releaseVersion: ${{ inputs.releaseVersion }}
      workingDirectory: ${{ github.workspace }}/vendordep
    environment:
      name: github-pages
    outputs:
      has_cpp: ${{ steps.cpp.outputs.has_cpp }}
    steps:
      - run: git config --global user.name "thenetworkgrinch" && git config --global user.email "thenetworkgrinch@noreply.users.github.com"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - run: chmod +x gradlew
        working-directory: ${{ env.workingDirectory }}

      - name: Install doxygen and graphviz
        run: sudo apt-get install -y doxygen graphviz

      - uses: gradle/actions/setup-gradle@v6

      - name: Install toolchain
        run: ./gradlew installSystemCoreToolchain
        working-directory: ${{ env.workingDirectory }}

      - name: Create and push release tag
        id: create_tag
        run: |
          TAG="v${{ inputs.releaseVersion }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, deleting it before re-creating."
            git push origin ":refs/tags/$TAG"
            echo "tag_existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_existed=false" >> "$GITHUB_OUTPUT"
          fi
          git tag -f "$TAG" ${{ github.sha }}
          git push origin "$TAG"

      - name: Download cross-platform maven artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: maven-*
          path: cross/
          merge-multiple: false

      # Pass 1: publish into a clean directory so the offline zip contains only
      # the current version's artifacts with correctly stitched metadata.
      - name: Merge cross-platform artifacts (pass 1, clean dir)
        run: |
          mkdir -p vendordep/build/maven
          for dir in cross/maven-*/; do
            cp -r "$dir." vendordep/build/maven/
          done

      - name: Build and publish (stitch current version maven metadata)
        run: ./gradlew publish -Ponlylinuxx64 -PskipCpp=${{ env.skipCpp }}
        working-directory: ${{ env.workingDirectory }}

      - name: Download example artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-examples
          path: release-artifacts/

      # Laid out to be extracted straight into the WPILib home for the vendordep's wpilibYear
      # (~/wpilib/<wpilibYear> or C:\Users\Public\wpilib\<wpilibYear>): maven/ is GradleRIO's local maven
      # repo and vendordeps/ is where "Install new libraries (offline)" looks for vendordep JSONs.
      - name: Zip current version maven for offline installation
        run: |
          offline="${{ github.workspace }}/offline"
          mkdir -p "$offline/maven" "$offline/vendordeps"
          cd ${{ env.workingDirectory }}/build/maven
          cp -r releases/. "$offline/maven/"
          cp yams_commands2.json yams_commands3.json "$offline/vendordeps/"
          cd "$offline"
          zip -r ${{ github.workspace }}/release-artifacts/${{ inputs.releaseVersion }}-YAMS-Offline.zip maven/ vendordeps/

      # Pass 2: rebuild on top of the full gh-pages history so the deployed
      # maven metadata covers all versions, not just the current one.
      - name: Clean maven directory for gh-pages checkout
        run: rm -rf ${{ env.workingDirectory }}/build/maven/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: ${{ env.workingDirectory }}/build/maven/

      - name: Merge cross-platform artifacts (pass 2, full history)
        run: |
          for dir in cross/maven-*/; do
            cp -r "$dir." vendordep/build/maven/
          done

      # The C++ artifacts live on cdn.yassrobotics.com instead of gh-pages, so their version history
      # comes from the CDN's maven-metadata.xml, which publish adds this version to. This runs after
      # the merge above: each cross-platform artifact carries a maven-metadata.xml listing only this
      # version, which would otherwise replace the CDN's history.
      - name: Fetch C++ maven metadata from the CDN
        if: ${{ env.skipCpp == 'false' }}
        run: |
          dir="${{ env.workingDirectory }}/build/maven/releases/yams/YAMS-cpp"
          url="https://cdn.yassrobotics.com/yams/YAMS-cpp/maven-metadata.xml"
          # Publishing without the CDN's history would drop every older version from the metadata.
          curl -fsS --retry 3 -o metadata.xml "$url"
          mkdir -p "$dir"
          rm -f "$dir"/maven-metadata.xml*
          mv metadata.xml "$dir/maven-metadata.xml"

      - name: Build and publish (Linux, fixes maven metadata for all versions)
        run: ./gradlew publish -Ponlylinuxx64 -PskipCpp=${{ env.skipCpp }}
        working-directory: ${{ env.workingDirectory }}

      # Both vendordep JSONs (yams_commands2.json and yams_commands3.json) are generated by
      # vendordepJson.gradle into build/maven, so they are deployed to gh-pages alongside the
      # maven repo. Also keep a versioned copy of each and attach them to the GitHub release.
      - name: Create versioned vendordep JSONs
        run: |
          cd ${{ env.workingDirectory }}/build/maven
          for variant in commands2 commands3; do
            cp "yams_${variant}.json" "yams_${variant}-${{ inputs.releaseVersion }}.json"
            cp "yams_${variant}.json" "${{ github.workspace }}/release-artifacts/yams_${variant}.json"
          done

      # Moves the C++ artifacts out of the gh-pages tree to keep it small: publish-maven-cdn uploads
      # them to cdn.yassrobotics.com. The first time, this also moves every older C++ version that
      # was still on gh-pages.
      - name: Move C++ artifacts off gh-pages
        id: cpp
        run: |
          src="${{ env.workingDirectory }}/build/maven/releases/yams/YAMS-cpp"
          if [ -d "$src" ]; then
            mkdir -p cdn/yams
            mv "$src" cdn/yams/
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ steps.cpp.outputs.has_cpp == 'true' }}
        with:
          name: maven-cdn
          path: cdn/

      - name: Push to gh-pages
        run: git add -A && git commit -m "Automatically add YAMS version ${{ inputs.releaseVersion }}" && git push
        working-directory: ${{ env.workingDirectory }}/build/maven/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          retention-days: '90'
          path: ${{ env.workingDirectory }}/build/maven/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output Pages Tree
        run: find ${{ env.workingDirectory }}/build/maven/ -type f

      # Builds the release description: a "What's new" list of every commit since the previous
      # full (non-prerelease, non-draft) release, followed by installation instructions. GitHub's
      # generated notes (merged PRs, new contributors, full changelog link) are appended after this
      # by --generate-notes.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.releaseVersion }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          # GradleRIO resolves the WPILib home as wpilib/<wpilibYear>, so the vendordep's wpilibYear
          # names the exact folder the offline zip goes into.
          WPILIB_YEAR=$(jq -r .wpilibYear ${{ env.workingDirectory }}/build/maven/yams_commands2.json)
          if [ -z "$WPILIB_YEAR" ] || [ "$WPILIB_YEAR" = "null" ]; then
            echo "Could not read wpilibYear from yams_commands2.json" >&2
            exit 1
          fi
          # Newest full release other than this one (it may still exist when re-running a release).
          PREVIOUS_TAG=$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$TAG"
            SINCE="since $PREVIOUS_TAG"
          else
            RANGE="$TAG"
            SINCE=""
          fi

          {
            echo "## What's new"
            echo
            if [ -n "$SINCE" ]; then
              echo "Commits $SINCE:"
              echo
            fi
            git log --no-merges --format="- %s ([%h]($REPO_URL/commit/%H))" "$RANGE"
            echo
            # Quoted heredoc so backslashes and backticks stay literal; @WPILIB_YEAR@ is filled in below.
            cat <<'EOF'
          ## Installation

          Pick the vendordep for the command framework your robot uses. Only install one of them.

          ### Online

          In VS Code, run **WPILib: Manage Vendor Libraries > Install new libraries (online)** and paste one of these URLs:

          | Command framework | Vendordep URL |
          | --- | --- |
          | Commands v2 | `https://yet-another-software-suite.github.io/YAMS/yams_commands2.json` |
          | Commands v3 | `https://yet-another-software-suite.github.io/YAMS/yams_commands3.json` |

          Pinned to this release: `https://yet-another-software-suite.github.io/YAMS/yams_commands2-${{ inputs.releaseVersion }}.json` and `https://yet-another-software-suite.github.io/YAMS/yams_commands3-${{ inputs.releaseVersion }}.json`.

          ### Offline

          Download `${{ inputs.releaseVersion }}-YAMS-Offline.zip` from the assets below. It contains a `maven` folder and a `vendordeps` folder that merge into your **@WPILIB_YEAR@** WPILib home folder. The `@WPILIB_YEAR@` folder is created by the matching WPILib installer, so install that first.

          **Windows:** extract into `C:\Users\Public\wpilib\@WPILIB_YEAR@`. In File Explorer, right click the zip, choose **Extract All...**, and enter that folder. Or in PowerShell:

          ```powershell
          Expand-Archive -Path "$HOME\Downloads\${{ inputs.releaseVersion }}-YAMS-Offline.zip" -DestinationPath "C:\Users\Public\wpilib\@WPILIB_YEAR@" -Force
          ```

          **macOS:** extract into `~/wpilib/@WPILIB_YEAR@`. Finder's double click extracts next to the zip instead, so use Terminal:

          ```bash
          unzip -o ~/Downloads/${{ inputs.releaseVersion }}-YAMS-Offline.zip -d ~/wpilib/@WPILIB_YEAR@
          ```

          **Linux:** extract into `~/wpilib/@WPILIB_YEAR@`:

          ```bash
          unzip -o ~/Downloads/${{ inputs.releaseVersion }}-YAMS-Offline.zip -d ~/wpilib/@WPILIB_YEAR@
          ```

          Afterwards you should have `wpilib/@WPILIB_YEAR@/maven/yams/...` and `wpilib/@WPILIB_YEAR@/vendordeps/yams_commands2.json` / `yams_commands3.json`. Then, in VS Code, run **WPILib: Manage Vendor Libraries > Install new libraries (offline)** and pick **Yet Another Mechanism System (Commands v2)** or **(Commands v3)**.

          Example projects for both command frameworks are also attached below.
          EOF
            echo
          } > release-notes.md
          sed -i "s/@WPILIB_YEAR@/$WPILIB_YEAR/g" release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.releaseVersion }}"
          if [ "${{ inputs.publish }}" = "true" ]; then
            RELEASE_FLAGS="--latest"
          else
            RELEASE_FLAGS="--prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, deleting it before re-creating."
            gh release delete "$TAG" --yes
            echo "release_existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_existed=false" >> "$GITHUB_OUTPUT"
          fi
          gh release create "$TAG" \
            --title "YAMS v${{ inputs.releaseVersion }}" \
            --notes-file release-notes.md \
            --generate-notes \
            $RELEASE_FLAGS \
            release-artifacts/*

      # Skip re-publishing to the WPILib vendor-json-repo when this run is overwriting an
      # existing tag/release for the same version, e.g. a re-run after a failure. That repo's PR
      # represents "this version now exists"; re-filing it for a version that already went out
      # would just create a duplicate/no-op PR against vendor-json-repo.
      - name: Create Vendor JSON Repo PR (Commands v2)
        if: ${{ inputs.publish == true && steps.create_tag.outputs.tag_existed == 'false' && steps.create_release.outputs.release_existed == 'false' }}
        uses: wpilibsuite/vendor-json-repo/.github/actions/add_vendordep@main
        with:
          repo: Yet-Another-Software-Suite/vendor-json-repo
          token: ${{ secrets.PUBLISH_VENDOR_JSON_TOKEN }}
          vendordep_file: ${{ env.workingDirectory }}/build/maven/yams_commands2-${{ inputs.releaseVersion }}.json
          pr_title: "Automatically add YAMS (Commands v2) version ${{ inputs.releaseVersion }}"
          pr_branch: "publish_yams_commands2_${{ inputs.releaseVersion }}"
        continue-on-error: true

      - name: Create Vendor JSON Repo PR (Commands v3)
        if: ${{ inputs.publish == true && steps.create_tag.outputs.tag_existed == 'false' && steps.create_release.outputs.release_existed == 'false' }}
        uses: wpilibsuite/vendor-json-repo/.github/actions/add_vendordep@main
        with:
          repo: Yet-Another-Software-Suite/vendor-json-repo
          token: ${{ secrets.PUBLISH_VENDOR_JSON_TOKEN }}
          vendordep_file: ${{ env.workingDirectory }}/build/maven/yams_commands3-${{ inputs.releaseVersion }}.json
          pr_title: "Automatically add YAMS (Commands v3) version ${{ inputs.releaseVersion }}"
          pr_branch: "publish_yams_commands3_${{ inputs.releaseVersion }}"
        continue-on-error: true

  # Uploads the C++ artifacts the release job moved off gh-pages to cdn.yassrobotics.com. The
  # yams-deploy account only accepts MAVEN_SSH_KEY through `rrsync -wo /srv/maven`: it can write
  # files under /srv/maven, but cannot read them back, run commands or reach anything else. The
  # secrets live in the maven-cloud environment, which only deploys from master and 2026.
  # If this job fails, re-run it: gh-pages no longer has the C++ artifacts, the maven-cdn artifact does.
  publish-maven-cdn:
    name: Release - Maven CDN
    needs: [release]
    if: ${{ needs.release.outputs.has_cpp == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    environment:
      name: maven-cloud
      url: https://cdn.yassrobotics.com/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: maven-cdn
          path: cdn/

      # The host key is pinned in MAVEN_KNOWN_HOSTS, so ssh never trusts an unknown server.
      # --checksum skips files the CDN already has, no --delete keeps older versions, and
      # --delay-updates puts every file in place only after the whole upload succeeds, so nobody
      # downloads metadata for binaries that are not there yet.
      - name: Upload to the Maven CDN
        env:
          SSH_KEY: ${{ secrets.MAVEN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MAVEN_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/yams-ci)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rl --checksum --delay-updates \
            -e "ssh -i $HOME/.ssh/yams-ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            cdn/ yams-deploy@159.223.199.132:

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/yams-ci

      - name: Check the C++ artifacts are served
        run: |
          curl -fsS -o /dev/null https://cdn.yassrobotics.com/yams/YAMS-cpp/maven-metadata.xml
          curl -fsS -o /dev/null "https://cdn.yassrobotics.com/yams/YAMS-cpp/${{ inputs.releaseVersion }}/YAMS-cpp-${{ inputs.releaseVersion }}.pom"
