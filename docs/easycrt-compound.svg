<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">No shortcut: two gears on one shaft</title>
<desc id="d">A 60 tooth shared gear and a 20 tooth gear are fixed to the same shaft. The 20 tooth gear meshes with the 200 tooth turret gear, and the encoder pinions mesh with the 60 tooth gear. Encoder A turns 200 over 20 times 60 over 19 times per turret turn, so EasyCRT needs the 60 tooth count and a gearing of 20 to 200 to get the turret angle.</desc>
<rect width="760" height="312" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="280" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34" y="46" font-size="15" font-weight="700" fill="#1f2933">No shortcut: two gears on one shaft</text>
<text x="34" y="65" font-size="11.5" fill="#52606d">When the shared gear is on a shaft with a different gear, the tooth counts no longer cancel.</text>
<circle cx="155.0" cy="182.0" r="49.0" fill="none" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 4"/>
