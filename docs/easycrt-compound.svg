<text x="350.0" y="116.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" >Encoder A turns per turret turn</text>
<text x="350.0" y="142.0" font-size="17" font-weight="700" text-anchor="start" fill="#1f2933" >200 / 20  ×  60 / 19  =  31.6</text>
<text x="350.0" y="164.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#d64545" >Not 200 / 19: the 20 and the 60 do not cancel.</text>
<text x="350.0" y="196.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" >Use the shared gear and the shaft to turret gearing</text>
<text x="350.0" y="220.0" font-size="14" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">new EasyCRT(60, 19, 21)</text>
<text x="350.0" y="242.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">new MechanismGearing(GearBox.fromTeeth(20, 200))</text>
<text x="350.0" y="264.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2933" >turret angle = shared gear angle × 20 / 200</text>
</svg>
