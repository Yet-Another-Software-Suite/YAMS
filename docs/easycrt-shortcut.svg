<text x="118.0" y="175.3" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2933">Turret gear</text>
<text x="118.0" y="188.8" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2933">200T</text>
<g opacity="0.45"><path d="M230.2,183.3 L235.8,187.1 L234.2,191.1 L227.5,190.0 L225.6,192.8 L229.0,198.7 L225.8,201.6 L220.3,197.7 L217.3,199.4 L217.9,206.2 L213.7,207.4 L210.4,201.6 L207.0,201.8 L204.6,208.1 L200.3,207.4 L199.8,200.7 L196.7,199.4 L191.7,204.1 L188.2,201.6 L190.7,195.3 L188.4,192.8 L181.9,194.9 L179.8,191.1 L184.8,186.6 L183.8,183.3 L177.1,182.3 L176.8,178.0 L183.3,176.1 L183.8,172.7 L178.2,168.9 L179.8,164.9 L186.5,166.0 L188.4,163.2 L185.0,157.3 L188.2,154.4 L193.7,158.3 L196.7,156.6 L196.1,149.8 L200.3,148.6 L203.6,154.4 L207.0,154.2 L209.4,147.9 L213.7,148.6 L214.2,155.3 L217.3,156.6 L222.3,151.9 L225.8,154.4 L223.3,160.7 L225.6,163.2 L232.1,161.1 L234.2,164.9 L229.2,169.4 L230.2,172.7 L236.9,173.7 L237.2,178.0 L230.7,179.9 Z" fill="#fde3c8" stroke="#c2630b" stroke-width="1.6" stroke-linejoin="round"/>
<text x="207.0" y="175.5" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2933">Drive</text>
<text x="207.0" y="187.5" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2933">40T</text></g>
<line x1="178" y1="207" x2="236" y2="149" stroke="#d64545" stroke-width="2.5"/>
<path d="M266.7,182.6 L270.9,186.3 L268.8,189.9 L263.5,188.2 L261.2,190.3 L262.4,195.8 L258.6,197.5 L255.3,193.0 L252.2,193.4 L250.0,198.5 L245.9,197.7 L245.8,192.1 L243.1,190.6 L238.3,193.4 L235.5,190.3 L238.7,185.8 L237.4,183.0 L231.9,182.4 L231.4,178.3 L236.7,176.5 L237.3,173.4 L233.1,169.7 L235.2,166.1 L240.5,167.8 L242.8,165.7 L241.6,160.2 L245.4,158.5 L248.7,163.0 L251.8,162.6 L254.0,157.5 L258.1,158.3 L258.2,163.9 L260.9,165.4 L265.7,162.6 L268.5,165.7 L265.3,170.2 L266.6,173.0 L272.1,173.6 L272.6,177.7 L267.3,179.5 Z" fill="#e4dcf7" stroke="#6b46c1" stroke-width="1.6" stroke-linejoin="round"/>
<text x="252.0" y="175.6" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2933">A</text>
<text x="252.0" y="187.1" font-size="9.5" font-weight="400" text-anchor="middle" fill="#1f2933">19T</text>
<text x="207.0" y="227.0" font-size="11" font-weight="700" text-anchor="middle" fill="#d64545" >cancels</text>
<text x="330.0" y="116.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" >Encoder A turns per turret turn</text>
<text x="330.0" y="142.0" font-size="17" font-weight="700" text-anchor="start" fill="#1f2933" >200 / 40  ×  40 / 19  =  200 / 19</text>
<text x="330.0" y="164.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#52606d" >The 40 is on both sides, so the drive gear drops out.</text>
<text x="330.0" y="196.0" font-size="12" font-weight="400" text-anchor="start" fill="#52606d" >So in layouts 2 and 3 you can also write</text>
<text x="330.0" y="220.0" font-size="14" font-weight="700" text-anchor="start" fill="#1f2933" font-family="Consolas, Menlo, monospace">new EasyCRT(200, 19, 21)</text>
<text x="330.0" y="244.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#147d6f" >and solve returns the turret angle. No conversion.</text>
</svg>
