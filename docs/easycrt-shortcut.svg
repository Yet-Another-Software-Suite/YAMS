<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Shortcut: gears that only mesh cancel out</title>
<desc id="d">The turret gear meshes with the drive gear, which meshes with encoder pinion A. Encoder A turns 200 over 40 times 40 over 19, which is 200 over 19, times per turret turn, so the drive gear cancels and EasyCRT can be given the turret tooth count directly.</desc>
<rect width="760" height="292" fill="#f5f7fa"/>
<rect x="16" y="16" width="728" height="260" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
<text x="34" y="46" font-size="15" font-weight="700" fill="#1f2933">Shortcut: gears that only mesh cancel out</text>
<text x="34" y="65" font-size="11.5" fill="#52606d">Any gear sitting between the pinions and the turret passes teeth through one for one.</text>
