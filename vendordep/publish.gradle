import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: 'maven-publish'

ext.licenseFile = files("$rootDir/../../LICENSE.txt")

ext.outputsFolder = file("$buildDir/outputs")

def versionFile = file("$outputsFolder/version.txt")
def releasesRepoUrl = "$releasePath/releases"

task outputVersions() {
    description = 'Prints the versions of wpilib to a file for use by the downstream packaging project'
    group = 'Build'
    outputs.files(versionFile)

    doFirst {
        buildDir.mkdir()
        outputsFolder.mkdir()
    }

    doLast {
        versionFile.write pubVersion
    }
}

task libraryBuild() {}

build.dependsOn outputVersions

task copyAllOutputs(type: Copy) {
    destinationDir = file("$buildDir/allOutputs")
    from versionFile
    dependsOn outputVersions
}

build.dependsOn copyAllOutputs
copyAllOutputs.dependsOn outputVersions

ext.addTaskToCopyAllOutputs = { task ->
    copyAllOutputs.dependsOn task
    copyAllOutputs.inputs.file task.archiveFile
    copyAllOutputs.from task.archiveFile
}

ext.artifactGroupId = 'yams'
ext.baseArtifactId = 'YAMS'
def zipBaseName = "_GROUP_yam_ID_${baseArtifactId}-cpp_CLS"

task cppHeadersZip(type: Zip) {
    destinationDirectory = outputsFolder
    archiveBaseName = zipBaseName
    archiveClassifier = "headers"

    from(licenseFile) {
        into '/'
    }

    from("$rootDir/../yams/cpp/include") {
        into '/'
    }
}

def doxygenOutputDir = file("$releasePath/doxygen")

def doxygenAvailable = {
    try {
        def result = ['doxygen', '--version'].execute()
        result.waitFor()
        result.exitValue() == 0
    } catch (ignored) {
        false
    }
}()

task generateDoxygen(type: Exec) {
    description = 'Generates Doxygen HTML documentation for C++ headers'
    group = 'Documentation'

    onlyIf { doxygenAvailable }

    inputs.dir("$rootDir/../yams/cpp/include")
    outputs.dir(doxygenOutputDir)

    doFirst {
        doxygenOutputDir.mkdirs()
        file("$buildDir/Doxyfile").text = """\
PROJECT_NAME           = "YAMS"
PROJECT_BRIEF          = "Yet Another Mechanism System"
OUTPUT_DIRECTORY       = ${doxygenOutputDir.absolutePath}
INPUT                  = ${file("$rootDir/../yams/cpp/include").absolutePath}
RECURSIVE              = YES
GENERATE_HTML          = YES
GENERATE_LATEX         = NO
GENERATE_XML           = NO
HTML_OUTPUT            = html
EXTRACT_ALL            = YES
FILE_PATTERNS          = *.h *.hpp *.dox
QUIET                  = YES
"""
    }

    commandLine 'doxygen', file("$buildDir/Doxyfile")
    ignoreExitValue = true
}

task cppDoxygenZip(type: Zip, dependsOn: generateDoxygen) {
    onlyIf { doxygenAvailable }
    destinationDirectory = outputsFolder
    archiveBaseName = zipBaseName
    archiveClassifier = "cppapi"

    from(doxygenOutputDir) {
        into '/'
    }
}

if (!skipCpp) {
    build.dependsOn cppHeadersZip
    addTaskToCopyAllOutputs(cppHeadersZip)
}

// -----------------------------------------------------------------------------------------------
// Java artifacts: "core" (no command-framework dependency) plus one jar per supported WPILib
// command version ("commands2", "commands3", ...). Each gets the same five jar tasks: a
// short-classifier jar + sources-jar for the Maven publication below, and a
// vendordep-output-named jar/sources-jar/javadoc-jar for copyAllOutputs. Add a name here (and a
// matching entry in vendordepJson.gradle's vendordepVariants) to publish a new variant; no other
// changes needed.
// -----------------------------------------------------------------------------------------------
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

def javaArtifactNames = ['core', 'commands2', 'commands3']
def javaArtifacts = [:]

javaArtifactNames.each { name ->
    def packageGlob = "yams/${name}/**"
    def outputBaseName = "_GROUP_yams_ID_${baseArtifactId}-${name}_CLS"
    def titleCaseName = name.capitalize()

    def jar = tasks.create("${name}Jar", Jar) {
        dependsOn classes
        archiveClassifier = name
        from(sourceSets.main.output) { include packageGlob }
    }
    def sourcesJar = tasks.create("${name}SourcesJar", Jar) {
        dependsOn classes
        archiveClassifier = "${name}-sources"
        from(sourceSets.main.allSource) { include packageGlob }
    }
    def outputJar = tasks.create("output${titleCaseName}Jar", Jar) {
        dependsOn classes
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        from(sourceSets.main.output) { include packageGlob }
    }
    def outputSourcesJar = tasks.create("output${titleCaseName}SourcesJar", Jar) {
        dependsOn classes
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'sources'
        from(sourceSets.main.allSource) { include packageGlob }
    }
    def outputJavadocJar = tasks.create("output${titleCaseName}JavadocJar", Jar) {
        dependsOn javadoc
        archiveBaseName = outputBaseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    javaArtifacts[name] = [
        jar: jar, sourcesJar: sourcesJar,
        outputJar: outputJar, outputSourcesJar: outputSourcesJar, outputJavadocJar: outputJavadocJar,
    ]

    addTaskToCopyAllOutputs(outputSourcesJar)
    addTaskToCopyAllOutputs(outputJavadocJar)
    addTaskToCopyAllOutputs(outputJar)
    build.dependsOn outputSourcesJar
    build.dependsOn outputJavadocJar
    build.dependsOn outputJar
}

// Builds yams_commands2.json/yams_commands3.json from yams.json and wires up their zip tasks
// (commands2VendordepJsonZip/commands3VendordepJsonZip) and build/copyAllOutputs dependencies.
apply from: 'vendordepJson.gradle'

artifacts {
    tasks.named("assemble") {
        javaArtifacts.each { name, t ->
            archives t.jar
            archives t.sourcesJar
            archives t.outputJar
            archives t.outputSourcesJar
            archives t.outputJavadocJar
        }
        archives javadocJar
    }
}

if (!skipCpp && doxygenAvailable) {
    build.dependsOn cppDoxygenZip
    addTaskToCopyAllOutputs(cppDoxygenZip)
}

libraryBuild.dependsOn build


publishing {
    repositories {
        maven {
            url = releasesRepoUrl
        }
    }
}

model {
    publishing {
        def taskList = createComponentZipTasks($.components, ['YAMS'], zipBaseName, Zip, project, includeStandardZipFormat)

        publications {
            if (!skipCpp) {
                cpp(MavenPublication) {
                    taskList.each {
                        artifact it
                    }
                    artifact cppHeadersZip
                    if (doxygenAvailable) {
                        artifact cppDoxygenZip
                    }

                    artifactId = "${baseArtifactId}-cpp"
                    groupId = artifactGroupId
                    version = pubVersion
                }
            }

            javaArtifactNames.each { name ->
                def t = javaArtifacts[name]
                "$name"(MavenPublication) {
                    artifact t.jar
                    artifact t.sourcesJar
                    artifact javadocJar

                    artifactId = "${baseArtifactId}-${name}"
                    groupId = artifactGroupId
                    version = pubVersion

                    // "core" has no dependency of its own; every other variant depends on it.
                    // Note: appendNode(...) is called with an explicit receiver (not via .with{})
                    // because groovy.util.Node's dynamic property lookup (for GPath-style child
                    // queries) silently returns an empty list for unrecognized properties instead
                    // of throwing, which would swallow the fallback to the outer artifactGroupId/
                    // baseArtifactId/pubVersion variables that .with{}'s delegate-first
                    // resolution normally provides.
                    if (name != 'core') {
                        pom.withXml {
                            def dependency = asNode().appendNode('dependencies').appendNode('dependency')
                            dependency.appendNode('groupId', artifactGroupId)
                            dependency.appendNode('artifactId', "${baseArtifactId}-core")
                            dependency.appendNode('version', pubVersion)
                        }
                    }
                }

                // Only non-core variants ship their own vendordep JSON.
                if (name != 'core') {
                    "${name}Vendordep"(MavenPublication) {
                        artifact tasks.named("${name}VendordepJsonZip").get()

                        artifactId = "${baseArtifactId}-${name}-vendordep"
                        groupId = artifactGroupId
                        version = pubVersion
                    }
                }
            }
        }
    }
}
