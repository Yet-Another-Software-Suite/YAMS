model {
publishing {
    def taskList = createComponentZipTasks($.components, ['YAMS'], zipBaseName, Zip, project, includeStandardZipFormat)
    //
    //        def driverTaskList = createComponentZipTasks($.components, ['VendorDriver'], driverZipBaseName, Zip, project, includeStandardZipFormat)
    //
    publications {
        if (!skipCpp) {
            cpp(MavenPublication) {
                taskList.each {
                    artifact it
                }
                artifact cppHeadersZip
                //                    artifact cppSourceZip
                if (doxygenAvailable) {
                    artifact cppDoxygenZip
                }

                artifactId = "${baseArtifactId}-cpp"
                groupId = artifactGroupId
                version = pubVersion
            }
        }
        //            driver(MavenPublication) {
        //                driverTaskList.each {
        //                    artifact it
        //                }
        //                artifact cppDriverHeadersZip
        //
        //                artifactId = "${baseArtifactId}-driver"
        //                groupId artifactGroupId
        //                version pubVersion
        //            }

        core(MavenPublication) {
            artifact coreJar
            artifact coreSourcesJar
            artifact javadocJar

            artifactId = "${baseArtifactId}-core"
            groupId = artifactGroupId
            version = pubVersion
        }

        commands2(MavenPublication) {
            artifact commands2Jar
            artifact commands2SourcesJar
            artifact javadocJar

            artifactId = "${baseArtifactId}-commands2"
            groupId = artifactGroupId
            version = pubVersion

            pom.withXml {
                asNode().appendNode('dependencies').appendNode('dependency').with {
                    appendNode('groupId', artifactGroupId)
                    appendNode('artifactId', "${baseArtifactId}-core")
                    appendNode('version', pubVersion)
                }
            }
        }

        commands3(MavenPublication) {
            artifact commands3Jar
            artifact commands3SourcesJar
            artifact javadocJar

            artifactId = "${baseArtifactId}-commands3"
            groupId = artifactGroupId
            version = pubVersion

            pom.withXml {
                asNode().appendNode('dependencies').appendNode('dependency').with {
                    appendNode('groupId', artifactGroupId)
                    appendNode('artifactId', "${baseArtifactId}-core")
                    appendNode('version', pubVersion)
                }
            }
        }

        commands2Vendordep(MavenPublication) {
            artifact commands2VendordepJsonZip

            artifactId = "${baseArtifactId}-commands2-vendordep"
            groupId = artifactGroupId
            version = pubVersion
        }

        commands3Vendordep(MavenPublication) {
            artifact commands3VendordepJsonZip

            artifactId = "${baseArtifactId}-commands3-vendordep"
            groupId = artifactGroupId
            version = pubVersion
        }
    }
}
